<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Akanshaa local-first assistant network</title>
  <desc id="desc">A phone-centered assistant connects voice, private memory, desktop tools, and user-approved actions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070a19"/><stop offset=".55" stop-color="#15133d"/><stop offset="1" stop-color="#080c21"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#54f4ff"/><stop offset=".5" stop-color="#8673ff"/><stop offset="1" stop-color="#ff56cd"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="url(#beam)" stroke-width="3" opacity=".72" filter="url(#glow)"><path d="M800 430L340 220M800 430L1260 220M800 430L340 690M800 430L1260 690"/><circle cx="800" cy="430" r="240" stroke-dasharray="3 16"/></g>
