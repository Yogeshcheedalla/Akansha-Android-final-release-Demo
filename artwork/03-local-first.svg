    <g transform="translate(1260 690)"><circle r="87" fill="#131a46" stroke="#ff70d5" stroke-width="3"/><path d="M0-38l34 15v22c0 25-15 41-34 51-19-10-34-26-34-51v-22zM-16 0l11 12 23-27" fill="none" stroke="#ffd2f2" stroke-width="5" stroke-linejoin="round"/><text y="125" fill="#e9f1ff" font-size="23">USER-APPROVED ACTIONS</text></g>
