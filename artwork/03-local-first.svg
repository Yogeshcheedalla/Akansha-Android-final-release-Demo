    <g transform="translate(340 220)"><circle r="87" fill="#131a46" stroke="#59eaff" stroke-width="3"/><path d="M-30 4v-8m15 20V-12M0 35V-35M15 12V-12M30 5V-5" stroke="#a4ffff" stroke-width="6" stroke-linecap="round"/><text y="125" fill="#e9f1ff" font-size="23">VOICE + WAKE</text></g>
    <g transform="translate(1260 220)"><circle r="87" fill="#131a46" stroke="#a47dff" stroke-width="3"/><path d="M-30-25h60v55h-60zM-17-10h34M-17 3h34M-17 16h24" fill="none" stroke="#d6c4ff" stroke-width="5" stroke-linecap="round"/><text y="125" fill="#e9f1ff" font-size="23">PRIVATE MEMORY</text></g>
